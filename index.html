<style>
  :root {
    --bg: #f7f8fb;
    --card: #ffffff;
    --ink: #0f172a;
    --ink-2: #4b5563;
    --mute: #8b93a1;
    --line: #e7eaf0;
    --red: #ef4444;
    --red-soft: #fde8e8;
    --coral: #f2545b;
    --green: #0a9b5c;
    --green-bg: #e3f6ec;
    --purple: #6d3fe0;
    --purple-bg: #efeafd;
    --amber: #b45309;
    --amber-bg: #fdf0cf;
    --blue-btn: #0b3b8f;
    --t-pink: #fde0e0;
    --t-lav: #ebe5fb;
    --t-mint: #d2f6ea;
    --t-yellow: #fcefbf;
    --t-blue: #dcebfd;
    --shadow: 0 6px 22px rgba(15, 23, 42, .06);
    --shadow-sm: 0 2px 10px rgba(15, 23, 42, .05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Heebo", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif;
    background: #e5e7eb; color: var(--ink); direction: rtl;
    display: flex; justify-content: center; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
  a { color: inherit; text-decoration: none; }
  svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  .app { width: 100%; max-width: 440px; min-height: 100vh; background: var(--bg); position: relative; padding-bottom: 130px; overflow-x: hidden; box-shadow: 0 0 40px rgba(0,0,0,.08); }
  .screen { display: none; }
  .screen.active { display: block; animation: screenIn .28s ease both; }
  @keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  }
  .head { padding: 22px 20px 0; }
  .loc { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .loc .i { font-size: 16px; color: var(--mute); }
  .head-grid { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .head-side { display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; }
  .head-side .wx { margin: 0; }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1.title { white-space: nowrap; font-size: 18px; font-weight: 800; letter-spacing: -.3px; line-height: 1.15; }
  .map-pill {
    background: linear-gradient(180deg, #f6666b, #ee4b52); color: #fff; font-size: 13px; font-weight: 700;
    padding: 6px 13px; border-radius: 999px; white-space: nowrap;
    box-shadow: 0 5px 12px rgba(239, 68, 68, .32); transition: transform .15s;
  }
  .map-pill:active { transform: scale(.96); }
  .dates { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; margin-top: 10px; }
  .dates .i { font-size: 16px; color: var(--mute); }

  /* ---------- DAY STRIP ---------- */
  .days { display: flex; gap: 8px; padding: 22px 20px 6px; }
  .day {
    flex: 1; height: 64px; background: #fff; border: 1px solid var(--line); border-radius: 15px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
    box-shadow: var(--shadow-sm); transition: all .22s cubic-bezier(.3,.8,.3,1);
  }
  .day .wd { font-size: 13px; color: var(--mute); font-weight: 600; line-height: 1; margin-bottom: 4px; }
  .day .num { font-size: 13px; font-weight: 800; line-height: 1; }
  .day .dot { position: absolute; bottom: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--red); opacity: 0; transition: opacity .2s; }
  .day.active { background: var(--ink); border-color: var(--ink); color: #fff; transform: translateY(-2px) scale(1.04); box-shadow: 0 10px 22px rgba(15,23,42,.28); }
  .day.active .wd { color: #aab2c0; }
  .day.active .dot { opacity: 1; }
  .day:active { transform: scale(.95); }

  .sec-head { display: flex; align-items: baseline; justify-content: space-between; padding: 26px 20px 14px; gap: 8px; }
  .sec-head h2 { font-size: 16px; font-weight: 800; }
  .sec-head .cnt { font-size: 13px; color: var(--mute); white-space: nowrap; }

  /* ---------- TIMELINE ---------- */
  .tl { padding: 0 16px 0 14px; }
  .row { display: flex; align-items: stretch; gap: 8px; }
  .tcol { width: 50px; flex-shrink: 0; position: relative; text-align: center; padding-top: 12px; }
  .tcol::before { content: ""; position: absolute; left: 50%; width: 2px; margin-left: -1px; background: #e4e7ee; top: 0; bottom: 0; }
  .row.first .tcol::before { top: 54px; }
  .row.last .tcol::before { bottom: auto; height: 54px; }
  .row.first.last .tcol::before { display: none; }
  .row.tr .tcol::before { top: 0; bottom: 0; }
  .row.tr .tcol { padding-top: 0; }
  .tcol .time { font-size: 13px; font-weight: 800; position: relative; z-index: 1; background: var(--bg); padding: 1px 2px; letter-spacing: .1px; }
  .tcol .pt { width: 12px; height: 12px; border-radius: 50%; background: #cfd4de; margin: 10px auto 0; position: relative; z-index: 1; box-shadow: 0 0 0 3px var(--bg); }
  .row.key .tcol .pt { background: var(--red); }
  .row .body { flex: 1; min-width: 0; padding-bottom: 12px; }

  .card { background: var(--card); border-radius: 15px; box-shadow: var(--shadow); border: 1px solid transparent; transition: border-color .2s, box-shadow .2s; overflow: hidden; }
  .card.open { border-color: #d9dde6; box-shadow: 0 10px 28px rgba(15,23,42,.10); }
  .card-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 8px; }
  .tile { width: 46px; height: 46px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; color: var(--ink); }
  .tile.pink { background: var(--t-pink); } .tile.lav { background: var(--t-lav); } .tile.mint { background: var(--t-mint); }
  .tile.yellow { background: var(--t-yellow); } .tile.blue { background: var(--t-blue); }
  .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .meta .t { font-size: 13px; font-weight: 800; line-height: 1.25; }
  .meta .s { font-size: 13px; color: var(--ink-2); line-height: 1.3; }
  .chip { align-self: flex-start; margin-top: 5px; font-size: 13px; font-weight: 700; padding: 3px 11px; border-radius: 10px; white-space: nowrap; }
  .chip.green { background: var(--green-bg); color: var(--green); }
  .chip.purple { background: var(--purple-bg); color: var(--purple); }
  .chip.amber { background: var(--amber-bg); color: var(--amber); }
  .chev { color: #a3aab8; font-size: 16px; transition: transform .25s; }
  .card.open .chev { transform: rotate(180deg); }

  .collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
  .card.open .collapse { grid-template-rows: 1fr; }
  .collapse > div { overflow: hidden; }
  .detail { margin: 0 0 0; padding: 14px 16px 16px; border-top: 1px solid var(--line); }
  .detail h4 { font-size: 13px; font-weight: 700; color: var(--mute); margin-bottom: 6px; }
  .detail p { font-size: 13px; line-height: 1.65; color: var(--ink); margin-bottom: 12px; }
  .detail p b { font-weight: 800; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; min-height: 52px; border-radius: 18px; font-weight: 800; font-size: 13px; margin-top: 8px; transition: transform .12s, opacity .12s; padding: 0 14px; }
  .btn:active { transform: scale(.98); opacity: .9; }
  .btn.dark { background: var(--ink); color: #fff; }
  .btn.blue { background: var(--blue-btn); color: #fff; }
  .btn.outline { background: #fff; border: 1px solid var(--line); color: var(--ink); }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn.outline { width: auto; padding: 0 22px; }

  .transit { display: inline-flex; align-items: center; gap: 8px; background: #eef1f5; border-radius: 999px; padding: 9px 16px; font-size: 13px; color: var(--ink-2); font-weight: 500; margin: 0 auto 12px; max-width: 100%; }
  .transit .i { font-size: 16px; color: #6b7280; }
  .row.tr .body { display: flex; justify-content: center; }

  /* ---------- OTHER SCREENS ---------- */
  .page-head { padding: 34px 20px 6px; }
  .page-head .h { display: flex; align-items: center; gap: 10px; }
  .page-head h1 { font-size: 18px; font-weight: 900; }
  .page-head .h .i { font-size: 22px; }
  .page-head p { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
  .pad { padding: 16px 16px 0; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tk { background: #fff; border-radius: 15px; box-shadow: var(--shadow); padding: 16px; min-height: 150px; display: flex; flex-direction: column; position: relative; text-align: right; transition: transform .15s; }
  .tk:active { transform: scale(.98); }
  .tk.wide { grid-column: 1 / -1; min-height: 168px; }
  .tk .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .tk .tile { width: 46px; height: 46px; border-radius: 15px; font-size: 20px; }
  .tk .count { white-space: nowrap; background: #eef1f5; font-size: 13px; font-weight: 700; padding: 4px 11px; border-radius: 10px; }
  .tk .tt { font-size: 13px; font-weight: 800; margin-top: 14px; }
  .tk .ts { font-size: 13px; color: var(--ink-2); line-height: 1.4; margin-top: 2px; }
  .tk .go { color: var(--coral); font-weight: 800; font-size: 13px; margin-top: auto; padding-top: 10px; display: flex; align-items: center; gap: 2px; }

  .apt { background: #fff; border-radius: 15px; box-shadow: var(--shadow); padding: 20px 18px 18px; }
  .apt .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .apt .top .tt { font-size: 13px; font-weight: 800; line-height: 1.25; }
  .apt .top .ss { font-size: 13px; color: var(--ink-2); margin-top: 4px; line-height: 1.35; }
  .apt .top .chip { margin: 2px 0 0; }
  .info { border: 1px solid var(--line); background: #fafbfd; border-radius: 15px; margin-top: 16px; padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 10px; }
  .info .k { font-size: 13px; color: var(--mute); font-weight: 600; }
  .info .v { font-size: 13px; font-weight: 800; margin-top: 2px; letter-spacing: .2px; }
  .map-box { position: relative; margin-top: 14px; height: 190px; background: #e2e5ea; border-radius: 15px; overflow: hidden; }
  .map-box .cover { position: absolute; inset: 0; z-index: 1; }
  .map-box .badge, .map-box .full { z-index: 2; }
  .tmap { position: absolute; inset: 0; background: #e9e6df; overflow: hidden; }
  .tmap img { position: absolute; width: 256px; height: 256px; max-width: none; user-select: none; -webkit-user-drag: none; }
  .map-box .attr { position: absolute; bottom: 2px; right: 5px; font-size: 9px; color: #444; background: rgba(255,255,255,.7); padding: 0 3px; border-radius: 3px; z-index: 2; }
  .map-box .badge { position: absolute; top: 12px; right: 12px; background: #fff; border-radius: 10px; padding: 7px 12px; font-weight: 700; color: #1a73e8; box-shadow: 0 2px 8px rgba(0,0,0,.15); display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .map-box .full { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(15,23,42,.88); color: #fff; font-weight: 700; font-size: 13px; padding: 8px 16px; border-radius: 999px; white-space: nowrap; }
  .apt .note { text-align: center; font-size: 13px; color: var(--mute); margin-top: 10px; line-height: 1.4; }

  .pax { margin-bottom: 14px; }
  .pax-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 10px; }
  .pax .tile { width: 46px; height: 46px; border-radius: 15px; font-size: 20px; }
  .pax .meta .t { font-size: 13px; }
  .pax .meta .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pax .chip { margin: 0; align-self: center; white-space: nowrap; font-size: 13px; padding: 3px 8px; }
  .pax-body { padding: 14px 16px 16px; border-top: 1px solid var(--line); }
  .pax-body h5 { font-size: 13px; font-weight: 700; color: var(--mute); margin: 0 0 8px; }
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }

    var head = t.closest('.card-head'); if (head) { toggleCard(head.parentElement, '.day-pane'); return; }
    var ph = t.closest('.pax-head'); if (ph) { toggleCard(ph.parentElement, '.screen'); return; }
  });
  document.addEventListener('change', function (e) {
    var el = e.target; if (!el || el.id !== 'f-files' || !FORM) return;
    var files = Array.prototype.slice.call(el.files || []); el.value = '';
    (function next() {
      var f = files.shift(); if (!f) return;
      compress(f, function (data) { if (data && FORM) { FORM.imgs.push(data); renderThumbs(); } else if (!data) alert('לא הצלחתי לקרוא את אחד הקבצים.'); next(); });
    })();
  });
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.slot[data-view]')) { e.preventDefault(); e.target.click(); }
  });
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
